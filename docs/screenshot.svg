  <text x="90" y="165" font-size="20" font-family="Arial">a = 2 + 1i</text>
  <text x="90" y="198" font-size="20" font-family="Arial">b = 3 + -2i</text>
  <text x="90" y="231" font-size="20" font-family="Arial">Operation: a * b</text>

